[build]
  publish = "dist"
  command = "npm run build"

# Static subdirectory — serve as-is, don't rewrite to React index.html
[[redirects]]
  from = "/aumanaai"
  to = "/aumanaai/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/aumanaai/*"
  to = "/aumanaai/:splat"
  status = 200
  force = true

# p1.creative static subdirectory
[[redirects]]
  from = "/p1.creative"
  to = "/p1.creative/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/p1.creative/*"
  to = "/p1.creative/:splat"
  status = 200
  force = true

# Aji Peru static page
[[redirects]]
  from = "/ajiperu"
  to = "/ajiperu/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/ajiperu/*"
  to = "/ajiperu/:splat"
  status = 200
  force = true

# React SPA fallback — must come last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
