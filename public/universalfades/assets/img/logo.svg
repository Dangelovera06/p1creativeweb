<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 150" role="img" aria-label="Universal Fades Barber Shop">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6c877"/>
      <stop offset="1" stop-color="#c19a41"/>
    </linearGradient>
  </defs>

  <!-- ===== Emblem badge ===== -->
  <g transform="translate(70 75)">
    <circle r="60" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
    <circle r="52" fill="none" stroke="#f4ecde" stroke-width="1" opacity=".45"/>

    <!-- crossed straight razors -->
    <g stroke="url(#gold)" stroke-width="3.2" fill="none" stroke-linecap="round">
      <path d="M-29 25 L17 -21"/>
      <path d="M29 25 L-17 -21"/>
    </g>
    <g fill="url(#gold)">
      <circle cx="-29" cy="25" r="5.2"/>
      <circle cx="29" cy="25" r="5.2"/>
    </g>

    <!-- top star + established mark -->
    <path d="M0 -38 l3.1 6.4 7 1 -5 4.9 1.1 7L0 -16.6 l-6.2 3.4 1.1-7-5-4.9 7-1z" fill="url(#gold)"/>
    <text x="0" y="44" text-anchor="middle" font-family="Oswald, Arial, sans-serif" font-weight="600"
          font-size="8.5" letter-spacing="3" fill="#f4ecde">EST.</text>
  </g>

  <!-- ===== Wordmark ===== -->
  <text x="150" y="60" font-family="Bebas Neue, Oswald, 'Arial Narrow', sans-serif"
        font-size="50" letter-spacing="1.5" fill="#f4ecde">UNIVERSAL</text>
  <text x="150" y="104" font-family="Bebas Neue, Oswald, 'Arial Narrow', sans-serif"
        font-size="50" letter-spacing="2.5" fill="url(#gold)">FADES</text>
  <text x="152" y="130" font-family="Oswald, Arial, sans-serif" font-weight="600"
        font-size="12" letter-spacing="5.5" fill="#8a7f6c">BARBER SHOP</text>
</svg>
